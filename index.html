<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Character Stroke Order</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>汉字 Stroke Order Viewer</h1>
        
        <div class="input-section">
            <input type="text" id="charInput" placeholder="Enter a Chinese character (e.g., 你, 学, 好)" maxlength="1">
        </div>
        
        <div id="character-target"></div>
        
        <div class="button-group">
            <button id="animateBtn">Animate</button>
            <button id="quizBtn">Quiz Me</button>
            <button id="outlineBtn">Show Outline</button>
        </div>
        
        <div class="info">
            Type a Chinese character above and press Enter, or click "Animate" to see the stroke order!
        </div>
    </div>

    <script src="js/writer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
