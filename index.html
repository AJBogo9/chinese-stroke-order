<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Character Stroke Order</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<div class="container">
<h1>汉字 Stroke Order Viewer</h1>
<div class="input-section">
<input type="text" id="charInput" placeholder="Enter a Chinese character (e.g., 你, 学, 好)" maxlength="1">
</div>
<div id="character-target"></div>
<div class="wasd-controls">
<div class="wasd-row">
<button id="animateBtn" class="wasd-btn">W<br><span class="btn-label">Animate All</span></button>
</div>
<div class="wasd-row">
<button id="prevStrokeBtn" class="wasd-btn">A<br><span class="btn-label">Previous</span></button>
<button id="repeatBtn" class="wasd-btn">S<br><span class="btn-label">Repeat</span></button>
<button id="nextStrokeBtn" class="wasd-btn">D<br><span class="btn-label">Next</span></button>
</div>
</div>
<div class="stroke-info-display">
<span id="strokeInfo">Stroke: -</span>
</div>
</div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
